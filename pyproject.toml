[project]
name = "nordicinsight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas", "pyarrow", "entsoe-py", "httpx",
  "python-dotenv", "mlflow", "matplotlib", "scikit-learn",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]